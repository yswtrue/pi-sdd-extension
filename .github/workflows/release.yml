name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.TAG_VERSION.replace(/^v/, "");
          const actual = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (expected !== actual) {
            console.error(`Tag version ${expected} does not match package version ${actual}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test package
        run: npm run ci

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
